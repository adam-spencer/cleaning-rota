services:
  app:
    build: .
    image: cleaning-rota
    container_name: cleaning-rota
    restart: unless-stopped
    ports:
      - '80:3000'
    volumes:
      - data:/data
    # Keep logs from slowly filling the SD card.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'

volumes:
  data:
    name: cleaning-rota-data
